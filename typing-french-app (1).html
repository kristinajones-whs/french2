<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Clavier Français — Cahier de dactylo</title>
<style>
  :root {
    --paper: #f7f1e2;
    --paper-edge: #ece2c8;
    --grid-line: #a9c6e8;
    --grid-line-soft: rgba(122,163,214,.28);
    --margin-red: #c1443a;
    --ink: #223449;
    --ink-soft: #4c5f76;
    --ink-faint: #8291a3;
    --pencil-green: #2f6e52;
    --pencil-green-deep: #1f4d3a;
    --correct-bg: rgba(47,110,82,.16);
    --wrong: #c1443a;
    --wrong-bg: rgba(193,68,58,.14);
    --accent-gold: #c78a2d;
    --panel: #fffdf6;
    --panel-border: #e4d8b8;
    --shadow: 0 2px 0 rgba(34,52,73,.06);
    --key-face: #fffdf8;
    --key-border: #d8cca9;
    --key-text: #2c3b4e;
    --home-ring: #2f6e52;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #16241c;
      --paper-edge: #101c15;
      --grid-line: #2b4a3c;
      --grid-line-soft: rgba(90,150,120,.18);
      --margin-red: #e07a6c;
      --ink: #eef2e8;
      --ink-soft: #b9c7bb;
      --ink-faint: #7f9384;
      --pencil-green: #7bc39a;
      --pencil-green-deep: #a9e0bf;
      --correct-bg: rgba(123,195,154,.18);
      --wrong: #e0776a;
      --wrong-bg: rgba(224,119,106,.16);
      --accent-gold: #e0b25a;
      --panel: #1c2c22;
      --panel-border: #2e4536;
      --shadow: 0 2px 0 rgba(0,0,0,.25);
      --key-face: #22332a;
      --key-border: #3a5646;
      --key-text: #eef2e8;
      --home-ring: #7bc39a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #16241c;
    --paper-edge: #101c15;
    --grid-line: #2b4a3c;
    --grid-line-soft: rgba(90,150,120,.18);
    --margin-red: #e07a6c;
    --ink: #eef2e8;
    --ink-soft: #b9c7bb;
    --ink-faint: #7f9384;
    --pencil-green: #7bc39a;
    --pencil-green-deep: #a9e0bf;
    --correct-bg: rgba(123,195,154,.18);
    --wrong: #e0776a;
    --wrong-bg: rgba(224,119,106,.16);
    --accent-gold: #e0b25a;
    --panel: #1c2c22;
    --panel-border: #2e4536;
    --shadow: 0 2px 0 rgba(0,0,0,.25);
    --key-face: #22332a;
    --key-border: #3a5646;
    --key-text: #eef2e8;
    --home-ring: #7bc39a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper-edge);
  }
  body {
    font-family: "Work Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--ink);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-tap-highlight-color: transparent;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  h1, h2, h3 { font-family: "Segoe Print", "Bradley Hand", cursive; font-weight: 700; margin: 0; }
  button { font-family: inherit; }

  .app {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; max-height: none; border-right: none; border-bottom: 1px solid var(--panel-border); }
  }

  /* ---------- Sidebar: spiral notebook tabs ---------- */
  .sidebar {
    background: var(--paper-edge);
    padding: 22px 14px 22px 18px;
    position: sticky;
    top: 0;
    top: env(safe-area-inset-top, 0px);
    height: 100vh;
    overflow-y: auto;
    border-right: 3px solid var(--panel-border);
  }
  .brand {
    display: flex; align-items: baseline; gap: 8px;
    margin-bottom: 4px;
  }
  .brand h1 { font-size: 2rem; color: var(--pencil-green-deep); line-height: 1; }
  .brand span.flag { font-size: 1.1rem; }
  .brand-sub { color: var(--ink-soft); font-size: .82rem; margin: 2px 0 18px; }

  .student-box {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .student-box label { display:block; font-size: .72rem; text-transform: none; color: var(--ink-faint); margin-bottom: 4px; }
  .student-row { display: flex; gap: 6px; }
  .student-row select, .student-row input {
    flex: 1; min-width: 0;
    font-family: inherit; font-size: .88rem;
    padding: 6px 8px; border-radius: 7px;
    border: 1px solid var(--panel-border);
    background: var(--paper); color: var(--ink);
  }
  .student-row button {
    border: 1px solid var(--panel-border);
    background: var(--pencil-green); color: #fdfaf0;
    border-radius: 7px; padding: 0 10px; cursor: pointer; font-size: .85rem;
  }
  .student-row button:hover { filter: brightness(1.06); }

  .nav-group { margin-bottom: 14px; }
  .nav-group-title {
    font-size: .78rem; color: var(--ink-faint); letter-spacing: .02em;
    padding: 6px 8px 4px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px; border-radius: 8px;
    cursor: pointer; color: var(--ink-soft);
    font-size: .92rem; border: 1px solid transparent;
    position: relative;
  }
  .nav-item:hover { background: var(--grid-line-soft); }
  .nav-item.active {
    background: var(--panel); border-color: var(--panel-border);
    color: var(--ink); box-shadow: var(--shadow);
  }
  .nav-item .stars { margin-left: auto; font-size: .78rem; color: var(--accent-gold); white-space: nowrap; }
  .nav-item.home-link { font-family:"Segoe Print", "Bradley Hand", cursive; font-size:1.15rem; font-weight:700; color: var(--pencil-green-deep); }

  .sidebar-foot {
    margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--panel-border);
    font-size: .76rem; color: var(--ink-faint); line-height: 1.5;
  }
  .sidebar-foot button {
    display:block; width:100%; margin-top:8px; padding: 8px 10px;
    border-radius: 8px; border: 1px solid var(--panel-border);
    background: var(--panel); color: var(--ink-soft); cursor: pointer; font-size: .8rem;
  }
  .sidebar-foot button:hover { color: var(--ink); }

  /* ---------- Main page (grid paper) ---------- */
  .page-wrap { padding: clamp(16px, 3vw, 40px); }
  .page {
    max-width: 880px; margin: 0 auto;
    background:
      repeating-linear-gradient(var(--paper), var(--paper) 27px, var(--grid-line-soft) 28px),
      var(--paper);
    background-size: 100% 28px;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    box-shadow: 0 8px 24px rgba(20,30,20,.08);
    position: relative;
    padding: 30px 26px 34px 56px;
    min-height: 70vh;
  }
  .page::before {
    content: "";
    position: absolute; left: 34px; top: 0; bottom: 0; width: 2px;
    background: var(--margin-red); opacity: .55;
  }

  /* ---------- Home dashboard ---------- */
  .dash-head h2 { font-size: 2.3rem; color: var(--pencil-green-deep); }
  .dash-head p { color: var(--ink-soft); max-width: 62ch; margin-top: 6px; line-height: 1.55; }
  .progress-strip {
    display:flex; gap: 18px; margin: 18px 0 28px; flex-wrap: wrap;
  }
  .stat-chip {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 10px 16px; box-shadow: var(--shadow);
    min-width: 120px;
  }
  .stat-chip .num { font-family:"Segoe Print", "Bradley Hand", cursive; font-size: 1.8rem; color: var(--pencil-green-deep); line-height: 1; }
  .stat-chip .lbl { font-size: .74rem; color: var(--ink-faint); margin-top: 2px; }

  .niveau-block { margin-bottom: 30px; }
  .niveau-block h3 { font-size: 1.6rem; color: var(--ink); margin-bottom: 10px; }
  .lesson-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 10px;
  }
  .lesson-card {
    text-align: left; cursor: pointer;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 12px 13px;
    box-shadow: var(--shadow);
    transition: transform .12s ease;
  }
  .lesson-card:hover { transform: translateY(-2px); }
  .lesson-card .lt { font-weight: 600; font-size: .93rem; color: var(--ink); }
  .lesson-card .lm { font-size: .76rem; color: var(--ink-faint); margin-top: 3px; }
  .lesson-card .lstars { margin-top: 6px; font-size: .8rem; color: var(--accent-gold); }
  .lesson-card .lstars.none { color: var(--ink-faint); }

  /* ---------- Lesson view ---------- */
  .lesson-head { display:flex; align-items:flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .lesson-head h2 { font-size: 2.1rem; color: var(--pencil-green-deep); }
  .back-link {
    background: none; border: none; color: var(--ink-soft); cursor: pointer;
    font-size: .85rem; padding: 0; margin-bottom: 8px; text-decoration: underline;
  }
  .lesson-meta { color: var(--ink-faint); font-size: .84rem; margin-top: 2px;}

  .live-stats { display:flex; gap: 22px; margin: 4px 0 20px; }
  .live-stats .s { text-align:center; }
  .live-stats .v { font-family:"Segoe Print", "Bradley Hand", cursive; font-size: 2.1rem; color: var(--pencil-green-deep); line-height:1; }
  .live-stats .k { font-size: .7rem; color: var(--ink-faint); }

  .prompt-box {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 22px 24px; box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .prompt-fr {
    font-family: "Courier New", "SFMono-Regular", Menlo, monospace;
    font-size: clamp(1.4rem, 4vw, 2rem);
    letter-spacing: .02em;
    line-height: 1.5;
    word-break: break-word;
  }
  .prompt-fr .ch { border-bottom: 2px solid transparent; padding-bottom: 1px; }
  .prompt-fr .ch.pending { color: var(--ink-faint); }
  .prompt-fr .ch.correct { color: var(--pencil-green); background: var(--correct-bg); border-radius: 3px; }
  .prompt-fr .ch.wrong { color: var(--wrong); background: var(--wrong-bg); border-radius: 3px; }
  .prompt-fr .ch.current { border-bottom-color: var(--pencil-green); }
  .prompt-en { color: var(--ink-soft); font-size: 1rem; margin-top: 10px; font-style: italic; }
  .prompt-hint { color: var(--ink-faint); font-size: .78rem; margin-top: 12px; }

  #typeInput {
    position: absolute; opacity: 0; height: 1px; width: 1px; pointer-events: none;
  }

  .lesson-controls { display:flex; gap: 10px; align-items:center; flex-wrap: wrap; margin-bottom: 22px; }
  .lesson-controls button, .lesson-controls label {
    font-size: .82rem; color: var(--ink-soft);
  }
  .btn {
    background: var(--pencil-green); color: #fdfaf0; border: none;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: .85rem;
  }
  .btn:hover { filter: brightness(1.07); }
  .btn.ghost {
    background: var(--panel); color: var(--ink-soft); border: 1px solid var(--panel-border);
  }
  .toggle-row { display:flex; align-items:center; gap:6px; }

  .item-dots { display:flex; gap:5px; flex-wrap:wrap; margin-bottom: 16px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--panel-border); }
  .dot.done { background: var(--pencil-green); }
  .dot.now { background: var(--accent-gold); }

  /* ---------- Keyboard ---------- */
  .keyboard-wrap { margin-top: 18px; }
  .keyboard {
    display: flex; flex-direction: column; gap: 6px;
    background: var(--paper-edge); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 14px; max-width: 640px;
  }
  .krow { display:flex; gap: 6px; justify-content: center; }
  .key {
    background: var(--key-face); border: 1px solid var(--key-border);
    color: var(--key-text);
    border-radius: 6px; height: 38px; min-width: 34px;
    display:flex; align-items:center; justify-content:center;
    font-size: .78rem; position: relative;
    box-shadow: 0 1px 0 rgba(0,0,0,.08);
  }
  .key.w15 { min-width: 50px; }
  .key.w20 { min-width: 64px; }
  .key.wspace { flex: 1; max-width: 320px; }
  .key.home::after {
    content:""; position:absolute; bottom: 5px; left:50%; transform: translateX(-50%);
    width: 10px; height: 2px; border-radius: 2px; background: var(--home-ring); opacity:.7;
  }
  .key.active {
    outline: 2px solid var(--pencil-green); outline-offset: 1px;
    background: var(--correct-bg);
  }
  .key.shifted { outline: 2px dashed var(--accent-gold); outline-offset: 1px; }
  .finger-legend { display:flex; gap: 10px; flex-wrap:wrap; margin-top: 10px; font-size: .72rem; color: var(--ink-faint); }
  .finger-legend .sw { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:middle; }

  .key.f-lp { background: color-mix(in srgb, var(--key-face) 70%, #d98a8a); }
  .key.f-lr { background: color-mix(in srgb, var(--key-face) 70%, #d9b98a); }
  .key.f-lm { background: color-mix(in srgb, var(--key-face) 70%, #d9d08a); }
  .key.f-li { background: color-mix(in srgb, var(--key-face) 70%, #a9d98a); }
  .key.f-ri { background: color-mix(in srgb, var(--key-face) 70%, #8ad9c9); }
  .key.f-rm { background: color-mix(in srgb, var(--key-face) 70%, #8ab0d9); }
  .key.f-rr { background: color-mix(in srgb, var(--key-face) 70%, #b28ad9); }
  .key.f-rp { background: color-mix(in srgb, var(--key-face) 70%, #d98ac2); }
  .key.f-th { background: var(--key-face); }

  .completion-banner {
    display:none; background: var(--panel); border: 2px solid var(--pencil-green);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; box-shadow: var(--shadow);
  }
  .completion-banner.show { display:block; animation: stamp .28s ease; }
  @keyframes stamp { 0% { transform: scale(1.15) rotate(-2deg); opacity:0; } 100% { transform: scale(1) rotate(0); opacity:1; } }
  .completion-banner h3 { color: var(--pencil-green-deep); font-size: 1.7rem; }
  .completion-banner .stampline { font-size: .88rem; color: var(--ink-soft); margin-top: 4px; }

  .teacher-note {
    margin-top: 34px; padding-top: 16px; border-top: 1px dashed var(--panel-border);
    font-size: .78rem; color: var(--ink-faint); line-height: 1.6; max-width: 60ch;
  }

  @media (prefers-reduced-motion: reduce) {
    .completion-banner.show, .lesson-card { animation: none !important; transition: none !important; }
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 6px; }
</style>
</head>

  <nav class="sidebar" id="sidebar"></nav>
  <main class="page-wrap"><div class="page" id="page"></div></main>
</div>
<input id="typeInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />

      ['la pomme de terre','the potato'],['les haricots verts','green beans'],['le pain','bread'],
      ['le fromage','cheese'],['la baguette','the baguette'],['les crêpes','crepes'],
      ['la pizza','pizza'],['le croissant','the croissant']
    ]},
    { id:'restaurant', title:'Vocabulaire du restaurant', icon:'🍽️', items:[
      ['le menu','the menu'],['l\u2019addition','the check / bill'],['le serveur','the waiter'],
      ['la serveuse','the waitress'],['commander','to order'],['une entrée','an appetizer'],
      ['un plat principal','a main course'],['un dessert','a dessert'],['une boisson','a drink'],
      ['l\u2019eau','water'],['le pourboire','the tip'],['réserver une table','to reserve a table']
    ]}
  ]}
];

/* ============================= KEYBOARD LAYOUT ============================= */
const ROWS = [
  [['`','lp'],['1','lp'],['2','lr'],['3','lm'],['4','li'],['5','li'],['6','ri'],['7','ri'],['8','rm'],['9','rr'],['0','rp'],['-','rp'],['=','rp']],
  [['q','lp'],['w','lr'],['e','lm'],['r','li'],['t','li'],['y','ri'],['u','ri'],['i','rm'],['o','rr'],['p','rp'],['[','rp'],[']','rp']],
  [['a','lp',1],['s','lr',1],['d','lm',1],['f','li',1],['g','li'],['h','ri'],['j','ri',1],['k','rm',1],['l','rr',1],[';','rp',1],['\'','rp']],
  [['z','lp'],['x','lr'],['c','lm'],['v','li'],['b','li'],['n','ri'],['m','ri'],[',','rm'],['.','rr'],['/','rp']]
];
const FINGER_NAMES = { lp:'left pinky', lr:'left ring', lm:'left middle', li:'left index', ri:'right index', rm:'right middle', rr:'right ring', rp:'right pinky', th:'thumbs' };
const LEFT_FINGERS = new Set(['lp','lr','lm','li']);
const ACCENT_MAP = { 'à':'a','â':'a','ä':'a','é':'e','è':'e','ê':'e','ë':'e','î':'i','ï':'i','ô':'o','ö':'o','ù':'u','û':'u','ü':'u','ç':'c','œ':'o','\u2019':'\'' };

function baseKeyFor(ch){
  const lower = ch.toLowerCase();
  return ACCENT_MAP[lower] || lower;
}

function buildKeyboard(){
  const wrap = document.createElement('div');
  wrap.className = 'keyboard';
  ROWS.forEach(row=>{
    const r = document.createElement('div'); r.className='krow';
    row.forEach(([k,f,home])=>{
      const b = document.createElement('div');
      b.className = 'key f-'+f + (home ? ' home' : '');
      b.dataset.key = k;
      b.dataset.finger = f;
      b.textContent = k;
      r.appendChild(b);
    });
    wrap.appendChild(r);
  });
  const spaceRow = document.createElement('div'); spaceRow.className='krow';
  const lshift = document.createElement('div'); lshift.className='key w20 f-lp'; lshift.textContent='shift'; lshift.dataset.key='shiftL'; lshift.dataset.finger='lp';
  const space = document.createElement('div'); space.className='key wspace f-th'; space.textContent='espace'; space.dataset.key=' '; space.dataset.finger='th';
  const rshift = document.createElement('div'); rshift.className='key w20 f-rp'; rshift.textContent='shift'; rshift.dataset.key='shiftR'; rshift.dataset.finger='rp';
  spaceRow.appendChild(lshift); spaceRow.appendChild(space); spaceRow.appendChild(rshift);
  wrap.appendChild(spaceRow);
  return wrap;
}

function highlightKeyboard(kbEl, nextChar){
  kbEl.querySelectorAll('.key').forEach(k=>{ k.classList.remove('active','shifted'); });
  if (nextChar === undefined) return;
  const base = baseKeyFor(nextChar);
  const needsShift = /^[A-Z]$/.test(nextChar);
  const target = kbEl.querySelector('.key[data-key="'+CSS.escape(base)+'"]');
  if (target) {
    target.classList.add('active');
    if (needsShift){
      const finger = target.dataset.finger;
      const shiftKey = LEFT_FINGERS.has(finger) ? 'shiftR' : 'shiftL';
      const shiftEl = kbEl.querySelector('.key[data-key="'+shiftKey+'"]');
      if (shiftEl) shiftEl.classList.add('shifted');
    }
  } else if (base === ' ') {
    const sp = kbEl.querySelector('.key[data-key=" "]');
    if (sp) sp.classList.add('active');
  }
}

/* ============================= STORAGE ============================= */
const STORE_KEY = 'ftt_students_v1';
function loadStore(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveStore(store){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){}
}
let store = loadStore();
let currentStudent = localStorage.getItem('ftt_current_student') || '';

function ensureStudent(name){
  if (!store[name]) store[name] = { lessons: {} };
  return store[name];
}
function recordResult(lessonId, wpm, accuracy){
  if (!currentStudent) return;
  const s = ensureStudent(currentStudent);
  const prev = s.lessons[lessonId];
  const best = prev ? Math.max(prev.bestWpm||0, wpm) : wpm;
  const bestAcc = prev ? Math.max(prev.bestAccuracy||0, accuracy) : accuracy;
  s.lessons[lessonId] = {
    bestWpm: Math.round(best*10)/10,
    bestAccuracy: Math.round(bestAcc*10)/10,
    lastWpm: Math.round(wpm*10)/10,
    lastAccuracy: Math.round(accuracy*10)/10,
    plays: (prev?.plays||0) + 1,
    lastPlayed: new Date().toISOString()
  };
  saveStore(store);
}
function starsFor(lessonId){
  const s = store[currentStudent];
  if (!s || !s.lessons[lessonId]) return 0;
  const acc = s.lessons[lessonId].bestAccuracy;
  if (acc >= 97) return 3;
  if (acc >= 90) return 2;
  if (acc >= 75) return 1;
  return 0;
}

/* ============================= APP STATE / ROUTING ============================= */
let route = { view:'home' };
const sidebarEl = document.getElementById('sidebar');
const pageEl = document.getElementById('page');
const typeInput = document.getElementById('typeInput');

function allLessons(){
  return NIVEAUX.flatMap(n => n.lessons.map(l => ({...l, niveauLabel:n.label, niveauId:n.id})));
}
function findLesson(id){ return allLessons().find(l=>l.id===id); }

function renderSidebar(){
  sidebarEl.innerHTML = '';
  const brand = document.createElement('div');
  brand.innerHTML = `<div class="brand"><span class="flag">🇫🇷</span><h1>Le Clavier</h1></div>
    <div class="brand-sub">Cahier de dactylo — apprends à taper sans regarder</div>`;
  sidebarEl.appendChild(brand);

  const sb = document.createElement('div');
  sb.className = 'student-box';
  const names = Object.keys(store);
  sb.innerHTML = `<label for="studentSelect">Élève</label>
    <div class="student-row">
      <select id="studentSelect">
        <option value="">— choisir —</option>
        ${names.map(n=>`<option value="${escapeHtml(n)}" ${n===currentStudent?'selected':''}>${escapeHtml(n)}</option>`).join('')}
      </select>
    </div>
    <div class="student-row" style="margin-top:6px;">
      <input id="newStudent" placeholder="nouveau prénom…" />
      <button id="addStudent">+</button>
    </div>`;
  sidebarEl.appendChild(sb);

  sb.querySelector('#studentSelect').addEventListener('change', e=>{
    currentStudent = e.target.value;
    localStorage.setItem('ftt_current_student', currentStudent);
    render();
  });
  sb.querySelector('#addStudent').addEventListener('click', ()=>{
    const val = sb.querySelector('#newStudent').value.trim();
    if (!val) return;
    ensureStudent(val); saveStore(store);
    currentStudent = val;
    localStorage.setItem('ftt_current_student', currentStudent);
    render();
  });

  const homeItem = document.createElement('div');
  homeItem.className = 'nav-item home-link' + (route.view==='home' ? ' active' : '');
  homeItem.textContent = '📖 Mon cahier';
  homeItem.addEventListener('click', ()=>{ route = {view:'home'}; render(); });
  sidebarEl.appendChild(homeItem);

  NIVEAUX.forEach(niv=>{
    const g = document.createElement('div'); g.className = 'nav-group';
    const t = document.createElement('div'); t.className = 'nav-group-title'; t.textContent = niv.label;
    g.appendChild(t);
    niv.lessons.forEach(l=>{
      const it = document.createElement('div');
      it.className = 'nav-item' + (route.view==='lesson' && route.lessonId===l.id ? ' active' : '');
      const st = starsFor(l.id);
      it.innerHTML = `<span>${l.icon}</span><span>${l.title}</span><span class="stars">${'★'.repeat(st)}${st===0?'':''}</span>`;
      it.addEventListener('click', ()=>{ route = {view:'lesson', lessonId:l.id}; render(); });
      g.appendChild(it);
    });
    sidebarEl.appendChild(g);
  });

  const foot = document.createElement('div');
  foot.className = 'sidebar-foot';
  foot.innerHTML = `Les progrès sont enregistrés sur cet ordinateur seulement.
    <button id="exportBtn">⬇ Télécharger mes résultats (.csv)</button>`;
  foot.querySelector('#exportBtn').addEventListener('click', exportResults);
  sidebarEl.appendChild(foot);
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function exportResults(){
  if (!currentStudent || !store[currentStudent]){
    alert('Choisis ou ajoute d\u2019abord ton prénom dans la barre de gauche.');
    return;
  }
  const rows = [['Élève','Leçon','Meilleur MPM','Meilleure précision (%)','Dernier MPM','Dernière précision (%)','Essais','Dernière session']];
  const s = store[currentStudent];
  allLessons().forEach(l=>{
    const r = s.lessons[l.id];
    if (!r) return;
    rows.push([currentStudent, l.title, r.bestWpm, r.bestAccuracy, r.lastWpm, r.lastAccuracy, r.plays, r.lastPlayed]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const filename = `${currentStudent.replace(/\s+/g,'_')}_progres.csv`;
  // Use the standard browser download API so the file works on any static host.
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* ============================= HOME VIEW ============================= */
function renderHome(){
  const total = allLessons().length;
  const s = store[currentStudent];
  const done = s ? Object.keys(s.lessons).filter(id=> (s.lessons[id].bestAccuracy||0) >= 75).length : 0;
  const avgWpm = s && Object.keys(s.lessons).length
    ? Math.round((Object.values(s.lessons).reduce((a,l)=>a+(l.bestWpm||0),0) / Object.keys(s.lessons).length) * 10)/10
    : 0;

  pageEl.innerHTML = `
    <div class="dash-head">
      <h2>Bienvenue dans ton cahier</h2>
      <p>Choisis une leçon à gauche. Garde les doigts sur la rangée de départ — <strong>A S D F</strong> pour la main gauche,
      <strong>J K L ;</strong> pour la main droite — et essaie de taper sans regarder le clavier.</p>
    </div>
    <div class="progress-strip">
      <div class="stat-chip"><div class="num">${done}/${total}</div><div class="lbl">leçons réussies</div></div>
      <div class="stat-chip"><div class="num">${avgWpm}</div><div class="lbl">mots/min (moyenne)</div></div>
      <div class="stat-chip"><div class="num">${currentStudent || '—'}</div><div class="lbl">élève actif</div></div>
    </div>
    ${NIVEAUX.map(niv => `
      <div class="niveau-block">
        <h3>${niv.label}</h3>
        <div class="lesson-grid">
          ${niv.lessons.map(l=>{
            const st = starsFor(l.id);
            return `<button class="lesson-card" data-id="${l.id}">
              <div class="lt">${l.icon} ${l.title}</div>
              <div class="lm">${l.items.length} mots / phrases</div>
              <div class="lstars ${st===0?'none':''}">${ st>0 ? '★'.repeat(st)+'☆'.repeat(3-st) : 'pas encore essayé' }</div>
            </button>`;
          }).join('')}
        </div>
      </div>
    `).join('')}
    <div class="teacher-note">
      <strong>Note pour l\u2019enseignant·e :</strong> les résultats sont enregistrés uniquement dans le navigateur de cet appareil
      (pas de compte requis). Chaque élève peut télécharger un fichier .csv de ses résultats depuis le menu de gauche et vous
      l\u2019envoyer ou le déposer dans Google Classroom.
    </div>
  `;
  pageEl.querySelectorAll('.lesson-card').forEach(btn=>{
    btn.addEventListener('click', ()=>{ route = {view:'lesson', lessonId: btn.dataset.id}; render(); });
  });
}

/* ============================= LESSON VIEW ============================= */
let lessonState = null;

function startLesson(lesson){
  lessonState = {
    lesson,
    index: 0,
    typed: '',
    startTime: null,
    totalKeystrokes: 0,
    errorKeystrokes: 0,
    correctCharsTyped: 0,
    elapsedMs: 0,
    finishedAt: null,
    strictAccents: false,
    showHints: true
  };
}

function normalizeCompare(s, stripAccents){
  let out = s.normalize('NFC').toLowerCase()
    .replace(/[’‘]/g, "'")
    .replace(/œ/g, 'o');
  if (stripAccents) out = out.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return out.trim();
}

function currentTarget(){
  return lessonState.lesson.items[lessonState.index][0];
}

function renderLesson(lessonId){
  const lesson = findLesson(lessonId);
  if (!lesson) { route = {view:'home'}; render(); return; }
  if (!lessonState || lessonState.lesson.id !== lesson.id){
    startLesson(lesson);
  }

  pageEl.innerHTML = `
    <button class="back-link" id="backBtn">← retour au cahier</button>
    <div class="lesson-head">
      <div>
        <h2>${lesson.icon} ${lesson.title}</h2>
        <div class="lesson-meta">${lesson.niveauLabel} · ${lesson.items.length} mots / phrases</div>
      </div>
    </div>

    <div class="live-stats">
      <div class="s"><div class="v" id="statWpm">0</div><div class="k">mots / min</div></div>
      <div class="s"><div class="v" id="statAcc">100%</div><div class="k">précision</div></div>
      <div class="s"><div class="v" id="statProg">${lessonState.index+1}/${lesson.items.length}</div><div class="k">progression</div></div>
    </div>

    <div class="item-dots" id="itemDots"></div>

    <div class="completion-banner" id="completionBanner">
      <h3>🎉 Bravo, leçon terminée !</h3>
      <div class="stampline" id="completionStats"></div>
    </div>

    <div class="prompt-box" id="promptBox">
      <div class="prompt-fr" id="promptFr"></div>
      <div class="prompt-en" id="promptEn"></div>
      <div class="prompt-hint">Clique ici puis tape le mot français. Les accents sont optionnels — concentre-toi sur la position des doigts.</div>
    </div>

    <div class="lesson-controls">
      <button class="btn" id="restartBtn">↺ Recommencer la leçon</button>
      <button class="btn ghost" id="skipBtn">Passer ce mot →</button>
      <label class="toggle-row"><input type="checkbox" id="hintsToggle" checked> afficher les touches</label>
      <label class="toggle-row"><input type="checkbox" id="strictToggle"> exiger les accents</label>
    </div>

    <div class="keyboard-wrap" id="kbWrap"></div>
  `;

  document.getElementById('backBtn').addEventListener('click', ()=>{ route={view:'home'}; render(); });
  document.getElementById('restartBtn').addEventListener('click', ()=>{ startLesson(lesson); refreshLessonUI(); typeInput.focus(); });
  document.getElementById('skipBtn').addEventListener('click', ()=>{ advanceItem(true); });
  document.getElementById('hintsToggle').addEventListener('change', e=>{ lessonState.showHints = e.target.checked; refreshLessonUI(); });
  document.getElementById('strictToggle').addEventListener('change', e=>{ lessonState.strictAccents = e.target.checked; });

  const kbWrap = document.getElementById('kbWrap');
  const kb = buildKeyboard();
  kbWrap.appendChild(kb);
  const legend = document.createElement('div');
  legend.className = 'finger-legend';
  legend.innerHTML = ['lp','lr','lm','li','ri','rm','rr','rp'].map(f=>
    `<span><span class="sw f-${f}" style="background:var(--key-face);" class="sw"></span></span>`).join('');
  // simple legend text instead of swatches for clarity
  legend.innerHTML = 'Rangée de départ (repères) : <strong>A S D F</strong> main gauche · <strong>J K L ;</strong> main droite';
  kbWrap.appendChild(legend);

  document.getElementById('promptBox').addEventListener('click', ()=> typeInput.focus());
  typeInput.value = '';
  typeInput.focus();

  refreshLessonUI();
}

function buildDots(){
  const dotsEl = document.getElementById('itemDots');
  if (!dotsEl) return;
  dotsEl.innerHTML = lessonState.lesson.items.map((_,i)=>{
    let cls = 'dot';
    if (i < lessonState.index) cls += ' done';
    else if (i === lessonState.index) cls += ' now';
    return `<span class="${cls}"></span>`;
  }).join('');
}

function refreshLessonUI(){
  buildDots();
  const item = lessonState.lesson.items[lessonState.index];
  const promptFr = document.getElementById('promptFr');
  const promptEn = document.getElementById('promptEn');
  if (!item){ return; }
  const target = item[0];
  const typed = lessonState.typed;
  let html = '';
  for (let i=0; i<target.length; i++){
    const ch = target[i];
    let cls = 'ch pending';
    if (i < typed.length){
      const tCh = typed[i];
      const match = lessonState.strictAccents
        ? normalizeCompare(tCh,false) === normalizeCompare(ch,false)
        : normalizeCompare(tCh,true) === normalizeCompare(ch,true);
      cls = 'ch ' + (match ? 'correct' : 'wrong');
    } else if (i === typed.length){
      cls = 'ch pending current';
    }
    html += `<span class="${cls}">${ch === ' ' ? '&nbsp;' : escapeHtml(ch)}</span>`;
  }
  promptFr.innerHTML = html;
  promptEn.textContent = item[1];

  document.getElementById('statProg').textContent = `${lessonState.index+1}/${lessonState.lesson.items.length}`;
  updateLiveStats();

  const kbWrap = document.getElementById('kbWrap');
  const kbEl = kbWrap ? kbWrap.querySelector('.keyboard') : null;
  if (kbEl){
    if (lessonState.showHints){
      highlightKeyboard(kbEl, target[typed.length]);
    } else {
      highlightKeyboard(kbEl, undefined);
    }
  }
}

function updateLiveStats(){
  const wpmEl = document.getElementById('statWpm');
  const accEl = document.getElementById('statAcc');
  if (!wpmEl) return;
  let wpm = 0;
  if (lessonState.startTime){
    const mins = (Date.now() - lessonState.startTime) / 60000;
    wpm = mins > 0 ? (lessonState.correctCharsTyped/5) / mins : 0;
  }
  const acc = lessonState.totalKeystrokes > 0
    ? 100 * (1 - lessonState.errorKeystrokes / lessonState.totalKeystrokes)
    : 100;
  wpmEl.textContent = Math.max(0, Math.round(wpm));
  accEl.textContent = Math.max(0, Math.round(acc)) + '%';
}

function advanceItem(skipped){
  const banner = document.getElementById('completionBanner');
  lessonState.index += 1;
  lessonState.typed = '';
  typeInput.value = '';
  if (lessonState.index >= lessonState.lesson.items.length){
    finishLesson();
    return;
  }
  refreshLessonUI();
}

function finishLesson(){
  const mins = lessonState.startTime ? (Date.now() - lessonState.startTime) / 60000 : 0;
  const wpm = mins > 0 ? (lessonState.correctCharsTyped/5) / mins : 0;
  const acc = lessonState.totalKeystrokes > 0
    ? 100 * (1 - lessonState.errorKeystrokes / lessonState.totalKeystrokes)
    : 100;
  recordResult(lessonState.lesson.id, wpm, acc);

  const dotsEl = document.getElementById('itemDots');
  if (dotsEl) dotsEl.querySelectorAll('.dot').forEach(d=>d.classList.add('done'));
  const promptBox = document.getElementById('promptBox');
  if (promptBox) promptBox.style.display = 'none';
  const banner = document.getElementById('completionBanner');
  if (banner){
    banner.classList.add('show');
    document.getElementById('completionStats').textContent =
      `${Math.round(wpm)} mots/min · ${Math.round(acc)}% de précision — enregistré pour ${currentStudent || '(choisis ton prénom à gauche)'}.`;
  }
  document.getElementById('statProg').textContent = `${lessonState.lesson.items.length}/${lessonState.lesson.items.length}`;
  renderSidebar();
}

typeInput.addEventListener('input', (e)=>{
  if (!lessonState) return;
  if (!lessonState.startTime) lessonState.startTime = Date.now();

  const val = e.target.value;
  const target = currentTarget();

  if (val.length > lessonState.typed.length){
    const idx = val.length - 1;
    const typedCh = val[idx];
    const targetCh = target[idx];
    lessonState.totalKeystrokes += 1;
    if (targetCh !== undefined){
      const match = lessonState.strictAccents
        ? normalizeCompare(typedCh,false) === normalizeCompare(targetCh,false)
        : normalizeCompare(typedCh,true) === normalizeCompare(targetCh,true);
      if (match) lessonState.correctCharsTyped += 1;
      else lessonState.errorKeystrokes += 1;
    } else {
      lessonState.errorKeystrokes += 1;
    }
  }
  lessonState.typed = val;
  refreshLessonUI();

  const doneMatch = lessonState.strictAccents
    ? normalizeCompare(val,false) === normalizeCompare(target,false)
    : normalizeCompare(val,true) === normalizeCompare(target,true);
  if (doneMatch){
    setTimeout(()=> advanceItem(false), 260);
  }
});

/* ============================= RENDER ROOT ============================= */
function render(){
  renderSidebar();
  if (route.view === 'lesson'){
    renderLesson(route.lessonId);
  } else {
    lessonState = null;
    renderHome();
  }
}

render();
</script>
